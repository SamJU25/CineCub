services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # Install wrangler, then serve static assets + the Pages Function on 0.0.0.0:3000.
    # wrangler pages dev reads .dev.vars for the TMDB_API_KEY used by the function.
    command: sh -c "npm install --no-audit --no-fund && npx wrangler pages dev . --ip 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  node_modules:
